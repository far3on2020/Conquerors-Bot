<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lords Mobile Bot Control</title>
    <!-- استدعاء مكتبة تلجرام الرسمية -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #151e27;
            color: #ffffff;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        h2 {
            text-align: center;
            color: #64b5f6;
            margin-bottom: 10px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        label {
            font-size: 14px;
            color: #b0bec5;
        }
        input {
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #37474f;
            background-color: #263238;
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        input:focus {
            border-color: #64b5f6;
        }
        .btn-submit {
            margin-top: 15px;
            padding: 14px;
            border-radius: 8px;
            border: none;
            background-color: #0088cc;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        .btn-submit:active {
            background-color: #006699;
        }
    </style>
</head>
<body>

    <h2>التحكم بالمحاكي 🚀</h2>

    <div class="input-group">
        <label for="email">البريد الإلكتروني (Email):</label>
        <input type="email" id="email" placeholder="example@gmail.com">
    </div>

    <div class="input-group">
        <label for="password">كلمة السر (Password):</label>
        <input type="password" id="password" placeholder="••••••••">
    </div>

    <div class="input-group">
        <label for="igg_id">معرف الحساب (IGG ID):</label>
        <input type="text" id="igg_id" placeholder="12345678">
    </div>

    <!-- زر احتياطي داخل الصفحة يضمن الإرسال حتى لو لم يظهر زر التلجرام السفلي -->
    <button class="btn-submit" onclick="sendDataToBot()">إرسال إلى المحاكي 🚀</button>

    <script>
        const tg = window.Telegram.WebApp;

        // تهيئة الواجهة
        tg.ready();
        tg.expand();

        // إظهار زر التلجرام الأساسي في الأسفل
        tg.MainButton.setText("إرسال إلى المحاكي 🚀");
        tg.MainButton.show();

        // الوظيفة الرئيسية لإرسال البيانات
        function sendDataToBot() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const igg_id = document.getElementById('igg_id').value.trim();

            if (!email || !password || !igg_id) {
                alert("يرجى إدخال جميع البيانات أولاً!");
                return;
            }

            // إرسال البيانات للبوت كـ JSON
            tg.sendData(JSON.stringify({
                email: email,
                password: password,
                igg_id: igg_id
            }));

            // إغلاق الواجهة تلقائياً
            tg.close();
        }

        // عند الضغط على زر التلجرام السفلي
        tg.MainButton.onClick(function() {
            sendDataToBot();
        });
    </script>
</body>
</html>
