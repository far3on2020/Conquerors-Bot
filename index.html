<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Conquerors</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body {
            background-color: #1a1a2e; /* خلفية عادية هادئة */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            background-color: rgba(30, 30, 45, 0.95);
            padding: 35px 30px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9);
            width: 360px;
            text-align: center;
            border: 1px solid #4a90e2;
        }
        .login-container h2 { color: #ffffff; margin-bottom: 25px; font-size: 24px; font-weight: bold; }
        .input-group { margin-bottom: 20px; text-align: right; }
        .input-group label { display: block; color: #a0a0b5; margin-bottom: 8px; font-size: 14px; }
        .input-group input {
            width: 100%; padding: 12px; border-radius: 8px;
            border: 1px solid #3a3a55; background-color: #2a2a40; color: #fff; font-size: 15px;
            transition: all 0.3s ease;
        }
        .input-group input:focus { outline: none; border-color: #4a90e2; box-shadow: 0 0 8px rgba(74, 144, 226, 0.3); }
        .login-btn {
            width: 100%; padding: 14px; margin-top: 10px;
            background: linear-gradient(135deg, #4a90e2, #007aff);
            color: #fff; border: none; border-radius: 8px; font-size: 16px; font-weight: bold;
            cursor: pointer;
        }
        .login-btn:hover { background: #357abd; }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>تسجيل الدخول للعبة</h2>
        <form action="#" method="POST">
            <div class="input-group">
                <label for="email">البريد الإلكتروني (Email):</label>
                <input type="email" id="email" name="email" placeholder="أدخل البريد الإلكتروني" required>
            </div>
            <div class="input-group">
                <label for="igg">معرف اللاعب (IGG ID):</label>
                <input type="text" id="igg" name="igg" placeholder="أدخل IGG الخاص بك" required>
            </div>
            <div class="input-group">
                <label for="password">كلمة المرور:</label>
                <input type="password" id="password" name="password" placeholder="أدخل كلمة المرور" required>
            </div>
            <button type="submit" class="login-btn">تسجيل الدخول</button>
        </form>
    </div>
</body>
</html>
